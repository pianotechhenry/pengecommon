# Watch list for the period-language desk - maintained by Henry.
#
# For what a corpus cannot see: senses, names, places, Romani and cant,
# idioms.  Every hit in a report shows the entry's reason and tag, alongside
# whatever the corpus itself says about the word.
#
#   term       word or phrase as written in the prose
#   kind       sense | name | place | romani | cant | idiom | word | accepted
#              (accepted: a word you have vetted, such as a character's name -
#              it is no longer flagged and the report lists it as accepted)
#   reason     why it is listed
#   tag        DOCUMENTED | REASONABLE INFERENCE | CONTESTED | UNVERIFIED
#   source     where the reason comes from (optional)
#   from_year  earliest recorded year for this use (optional): before it a hit
#              is a FLAG, within the borderline window after it BORDERLINE,
#              later a NOTE.  Without it a hit is shown as WATCH.
#   match      word (default: also matches regular inflections) | exact |
#              phrase | regex
#   also       other spellings to match (optional)
#   case       true = capitalised only (a name, not the common noun)
#   corpus     the corpus's own earliest printed date for the form, where it
#              has one (filled in by `desk watchlist --annotate`; a printed
#              form may be a different word or sense - see the report's KWIC)
#
# Words take effect at once.  A new multi-word phrase is looked up in the
# n-gram index straight away, but to find it even where it was printed only
# once or twice, run:  desk build --stage scan   (a few minutes).
#
# Seed entries, November 2026.

- term: Rowan
  kind: name
  case: true
  reason: not recorded as a given name before the 20th century
  tag: DOCUMENTED
  source: one source
  from_year: 1900
  corpus: "earliest firm-dated print 1493 (A23590); 29 texts"

